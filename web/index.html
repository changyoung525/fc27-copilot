<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FC27 Copilot Status</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;max-width:700px;margin:50px auto;padding:0 20px;background:#111318;color:#f2f4f6}.box{border:1px solid #303640;border-radius:12px;padding:18px;background:#181b21}.ok{color:#89e6a5}.bad{color:#ff9ca8}pre{white-space:pre-wrap;background:#0d0f13;padding:12px;border-radius:8px;max-height:420px;overflow:auto;font-size:12px}
  </style>
</head>
<body>
  <h1>FC27 Copilot Status</h1>
  <div class="box">
    <p>fc27d: <b id="daemonState" class="bad">checking</b></p>
    <p>Extension bridge: <b id="bridgeState" class="bad">checking</b></p>
    <p><small>The extension connects directly to this server. Open the FC27 Web App and sign in; this page is optional.</small></p>
    <p><button type="button" id="syncGallery">Sync FUT Gallery</button></p>
    <p id="galleryStatus" role="status"></p>
    <pre id="health"></pre>
  </div>
<script>
const daemonState=document.getElementById('daemonState');
const bridgeState=document.getElementById('bridgeState');
const health=document.getElementById('health');
const syncGallery=document.getElementById('syncGallery');
const galleryStatus=document.getElementById('galleryStatus');
let startingGallery=false;
async function galleryTool(name, args={}){
  const response=await fetch('/mcp',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({jsonrpc:'2.0',id:1,method:'tools/call',params:{name,arguments:args}}),
  });
  const reply=await response.json();
  const result=reply.result?.structuredContent;
  if(!result?.ok) throw new Error(result?.error?.message ?? reply.error?.message ?? 'Gallery request failed.');
  return result.data;
}
async function refreshGallery(){
  if(startingGallery) return;
  const data=await galleryTool('gallery_query',{limit:1});
  if(startingGallery) return;
  const {sync,snapshot_at,total}=data;
  const snapshot=snapshot_at===null?'':' Last saved: '+total+' cards ('+snapshot_at+').';
  syncGallery.disabled=sync.state==='running';
  if(sync.state==='running'){
    galleryStatus.textContent='Syncing Gallery… '+sync.scanned+' cards checked.'+snapshot;
  }else if(sync.state==='failed'){
    galleryStatus.textContent=sync.error.message+snapshot;
  }else{
    galleryStatus.textContent=snapshot_at===null?'No Gallery sync saved yet.':snapshot.trim();
  }
}
syncGallery.addEventListener('click',async()=>{
  startingGallery=true;
  syncGallery.disabled=true;
  galleryStatus.textContent='Starting Gallery sync…';
  try{
    await galleryTool('sync_gallery');
  }catch(error){
    galleryStatus.textContent=error.message;
    syncGallery.disabled=false;
    return;
  }finally{
    startingGallery=false;
  }
  refreshGallery().catch(error=>{galleryStatus.textContent=error.message;});
});
async function refresh(){
  try{
    const response=await fetch('/health',{cache:'no-store'});
    const value=await response.json();
    daemonState.textContent=value.ok?'healthy':'error';
    daemonState.className=value.ok?'ok':'bad';
    const connected=Boolean(value.browser_bridge?.connected);
    bridgeState.textContent=connected?'connected':'waiting for extension';
    bridgeState.className=connected?'ok':'bad';
    health.textContent=JSON.stringify(value,null,2);
  }catch(error){
    daemonState.textContent='unreachable';
    daemonState.className='bad';
    health.textContent=error.message;
  }
  await refreshGallery().catch(()=>{});
}
refresh();
setInterval(refresh,3000);
</script>
</body>
</html>
